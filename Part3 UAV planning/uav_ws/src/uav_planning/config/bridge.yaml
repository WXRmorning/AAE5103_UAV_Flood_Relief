# Harmonic / Humble：桥接仿真时钟与真值里程计；飞行命令通过 DDS 发给 PX4。
# 真值里程计用于验证/画图，不作为本节点的飞控反馈，也不替代 PX4 状态估计。
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
  publisher_queue: 10
  subscriber_queue: 10
  lazy: false

- ros_topic_name: /simulation/ground_truth/odometry
  gz_topic_name: /model/x500_0/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
  publisher_queue: 10
  subscriber_queue: 10
  lazy: false
