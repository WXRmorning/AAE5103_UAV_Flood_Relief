# 名称 -> SDF标记表面的map/ENU坐标，单位米；访问时统一在表面上方2米悬停。
# A..G分别对应P1..P7。这里的A是P1，不是地图旧的绿色“A基地”中心。
# S1/S2/S3是三个停机位；双机演示分别从S1、S2起飞。
# 手动路线发布节点和自动分发节点分别加载这一份坐标表。
/**:
  ros__parameters:
    visit_height: 2.0
    points:
      S1: [-24.0, -18.0, 0.0]
      S2: [-22.0, -18.0, 0.0]
      S3: [-23.0, -16.0, 0.0]
      A: [-23.0, 5.207, 5.0]     # P1，访问Z=7。
      B: [-6.0, 15.959, 8.0]      # P2，访问Z=10。
      C: [16.0, 17.0, 12.0]     # P3，访问Z=14。
      D: [24.0, 4.0, 5.0]       # P4，访问Z=7。
      E: [21.0, -16.0, 8.0]     # P5，访问Z=10。
      F: [4.0, -19.0, 12.0]     # P6，访问Z=14。
      G: [-10.0, 0.0, 0.0]      # P7，访问Z=2。
